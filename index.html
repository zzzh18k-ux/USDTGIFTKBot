<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #fdfcfb 0%, #e2d1c3 100%);
            --accent-brown: #7b5b4a;
            --soft-beige: #f4ece4;
            --deep-copper: #bb7457;
            --text-main: #4a372d;
            --text-secondary: #9e8a7f;
            --shadow-sm: 0 4px 12px rgba(123, 91, 74, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header & Bonus Icon */
        .header {
            padding: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        #dailyBonusBtn {
            width: 44px;
            height: 44px;
            background: var(--soft-beige);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(123, 91, 74, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        #dailyBonusBtn:active { transform: scale(0.95); background: #eee5dc; }

        .bonus-icon-svg { width: 20px; fill: var(--accent-brown); }

        #bonusTimer {
            position: absolute;
            bottom: -20px;
            right: 0;
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }

        /* Main Balance Area */
        .balance-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #userBalance {
            font-family: "Didot", "Bodoni MT", "Cormorant Garamond", serif;
            font-size: 84px;
            font-weight: 300;
            margin: 0;
            letter-spacing: -2px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .currency-label {
            font-size: 18px;
            letter-spacing: 4px;
            color: var(--text-secondary);
            margin-top: -10px;
            text-transform: uppercase;
        }

        .floating-increment {
            position: absolute;
            color: var(--deep-copper);
            font-weight: 600;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
        }

        /* Action Buttons */
        .actions-grid {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 50px;
        }

        .btn-premium {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-light { background: var(--soft-beige); color: var(--accent-brown); }
        .btn-dark { background: var(--deep-copper); color: white; box-shadow: var(--shadow-sm); }
        
        .btn-premium:active { transform: translateY(2px); opacity: 0.9; }

        /* Toast & Status */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 55, 45, 0.9);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .footer-status {
            padding-bottom: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="dailyBonusBtn">
            <svg class="bonus-icon-svg" viewBox="0 0 24 24"><path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/></svg>
            <span id="bonusTimer">00:00:00</span>
        </div>
    </div>

    <div class="balance-container" id="balanceWrapper">
        <h1 id="userBalance">0.00</h1>
        <span class="currency-label">USDT</span>
    </div>

    <div class="actions-grid">
        <button id="inviteBtn" class="btn-premium btn-dark">Invitar usuario</button>
        <button id="withdrawBtn" class="btn-premium btn-light">Retirar fondos</button>
        <button id="redeemBtn" class="btn-premium btn-light">Canjear código</button>
    </div>

    <div class="footer-status" id="connectionStatus">Sincronizado</div>
    <div id="toast">Acción completada</div>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
            authDomain: "usdt-8b129.firebaseapp.com",
            projectId: "usdt-8b129",
            storageBucket: "usdt-8b129.firebasestorage.app",
            messagingSenderId: "816855613636",
            appId: "1:816855613636:web:7891ba3996acef2c91c991"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Variables de Elementos UI
        const dailyBonusBtn = document.getElementById('dailyBonusBtn');
        const inviteBtn     = document.getElementById('inviteBtn');
        const withdrawBtn   = document.getElementById('withdrawBtn');
        const redeemBtn     = document.getElementById('redeemBtn');
        const balanceEl     = document.getElementById('userBalance');
        const bonusTimer    = document.getElementById('bonusTimer');
        const statusEl      = document.getElementById('connectionStatus');

        let currentUserData = null;

        // Toast Profesional
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // Animación de Incremento
        function animateIncrement(amount) {
            const inc = document.createElement('div');
            inc.className = 'floating-increment';
            inc.innerText = `+${amount.toFixed(2)}`;
            document.getElementById('balanceWrapper').appendChild(inc);
            setTimeout(() => inc.remove(), 1200);
            
            balanceEl.style.transform = 'scale(1.05)';
            setTimeout(() => { balanceEl.style.transform = 'scale(1)'; }, 200);
        }

        // Gestión de Tiempo (24h)
        function updateTimer(lastTimestamp) {
            const now = Date.now();
            const nextBonus = lastTimestamp + (24 * 60 * 60 * 1000);
            const diff = nextBonus - now;

            if (diff <= 0) {
                bonusTimer.innerText = "Disponible";
                dailyBonusBtn.style.opacity = "1";
                return true;
            } else {
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                bonusTimer.innerText = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                dailyBonusBtn.style.opacity = "0.6";
                return false;
            }
        }

        async function loadAppData() {
            const user = tg.initDataUnsafe?.user;
            if (!user) return;

            const userRef = db.collection("usuarios").doc(user.id.toString());
            const doc = await userRef.get();

            if (doc.exists) {
                currentUserData = doc.data();
                balanceEl.innerText = currentUserData.balance.toFixed(2);
                
                // Iniciar contador
                setInterval(() => {
                    if (currentUserData.lastDailyBonus) {
                        updateTimer(currentUserData.lastDailyBonus);
                    } else {
                        bonusTimer.innerText = "Disponible";
                    }
                }, 1000);
            } else {
                // Registro inicial
                const startParam = tg.initDataUnsafe?.start_param;
                if (startParam && startParam !== user.id.toString()) {
                    await db.collection("usuarios").doc(startParam).update({
                        balance: firebase.firestore.FieldValue.increment(0.50),
                        referidos: firebase.firestore.FieldValue.increment(1)
                    });
                }
                await userRef.set({
                    id: user.id,
                    balance: 0.00,
                    lastDailyBonus: 0,
                    referidos: 0
                });
                loadAppData();
            }
            statusEl.innerText = "Actualizado";
        }

        // Lógica de Botones
        dailyBonusBtn.onclick = async () => {
            const isAvailable = updateTimer(currentUserData.lastDailyBonus || 0);
            if (!isAvailable) {
                showToast("No disponible");
                return;
            }

            const now = Date.now();
            await db.collection("usuarios").doc(tg.initDataUnsafe.user.id.toString()).update({
                balance: firebase.firestore.FieldValue.increment(0.05),
                lastDailyBonus: now
            });
            
            animateIncrement(0.05);
            currentUserData.balance += 0.05;
            currentUserData.lastDailyBonus = now;
            balanceEl.innerText = currentUserData.balance.toFixed(2);
            showToast("Completado");
        };

        inviteBtn.onclick = () => {
            const refLink = `https://t.me/USDTGIFTKBot?startapp=${tg.initDataUnsafe.user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=Acceso al terminal USDT`);
            showToast("Enlace generado");
        };

        withdrawBtn.onclick = () => {
            if (currentUserData.balance >= 10) {
                showToast("Procesando solicitud");
            } else {
                showToast("Mínimo: 10.00");
            }
        };

        redeemBtn.onclick = () => {
            showToast("Función restringida");
        };

        loadAppData();
    </script>
</body>
</html>
