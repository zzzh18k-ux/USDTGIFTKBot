<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT K - Migración</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #ffcc00;
            --orange-gradient: linear-gradient(135deg, #d37a5a 0%, #e68d71 100%);
            --bg-color: #fdf5e6;
            --text-main: #5d4037;
            --accent: #d37a5a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdf5e6;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }
        .screen.active { display: flex; }

        .balance-card { text-align: center; margin: 20px 0; }
        #user-balance { font-size: 48px; font-weight: 800; }
        
        .click-object {
            background: radial-gradient(circle, #ffe066 0%, #ffcc00 100%);
            width: 180px; height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 5px solid #e6b800;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.7);
            cursor: pointer;
        }
        .click-object i { font-size: 80px; color: #fff; }

        .progress-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; margin-top: 15px; }
        .progress-bar-fill { width: 0%; height: 100%; background: var(--orange-gradient); transition: width 0.3s; }

        .btn-main {
            background: var(--orange-gradient);
            color: white; border: none; padding: 15px; border-radius: 30px;
            font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer;
        }
        .btn-main.disabled { background: #ccc; }

        .glass-card { background: white; border-radius: 25px; padding: 20px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .back-btn { cursor: pointer; margin-bottom: 10px; font-weight: bold; color: var(--accent); }
        
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
            opacity: 0; transition: 0.3s; z-index: 1000;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="toast" class="toast"></div>

    <div id="home-screen" class="screen active">
        <div class="balance-card">
            <div id="user-balance">0.0000</div>
            <p style="font-size: 12px; opacity: 0.6; letter-spacing: 2px;">USDT DISPONIBLE</p>
        </div>

        <div class="click-object" id="clickObject">
            <i class="fas fa-coins"></i>
            <span style="color:white; font-weight:bold; font-size:10px; margin-top:5px;">TOCA AQUÍ</span>
        </div>

        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <p id="clicks-text" style="text-align:center; font-size:12px; margin-top:5px;">0 / 10 clicks</p>

        <button id="claimBtn" class="btn-main disabled">RECLAMAR RECOMPENSA</button>
        
        <div style="margin-top: 20px;">
            <button class="btn-main" style="background:white; color:var(--text-main);" onclick="nav('withdraw-screen')">Mi Cosecha (Retirar)</button>
            <button class="btn-main" style="background:white; color:var(--text-main);" onclick="nav('invite-screen')">Equipo (Referidos)</button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-arrow-left"></i> Volver</div>
        <div class="glass-card">
            <h3>Retirar a CCWallet</h3>
            <p style="font-size:12px; margin: 10px 0;">Envío directo a @cctip_bot</p>
            <input type="text" id="cc-id" placeholder="Tu ID de CCWallet" style="width:100%; padding:12px; border-radius:15px; border:1px solid #ddd;">
            <button class="btn-main" onclick="solicitarRetiro()">Solicitar Retiro</button>
        </div>
    </div>

    <div id="invite-screen" class="screen">
        <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-arrow-left"></i> Volver</div>
        <div class="glass-card">
            <h3>Mi Equipo</h3>
            <p>Invita y gana el 15% de comisión.</p>
            <div id="ref-link" style="background:#f0f0f0; padding:10px; border-radius:10px; margin:10px 0; font-size:11px; word-break:break-all;">...</div>
            <button class="btn-main" onclick="copiarLink()">Copiar Enlace</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    const userId = tg.initDataUnsafe?.user?.id?.toString() || "test_user";
    const userName = tg.initDataUnsafe?.user?.first_name || "Usuario";

    let balance = 0;
    let clicks = 0;

    // --- MIGRACIÓN DE SALDO ---
    async function migrarDatos(userRef) {
        const LLAVE_VIEJA = '_candy_v8_lanzamiento_oficial';
        const datosLocales = localStorage.getItem(LLAVE_VIEJA);
        
        if (datosLocales) {
            try {
                const data = JSON.parse(datosLocales);
                const saldoAnterior = parseFloat(data.profit) || 0;
                
                if (saldoAnterior > 0) {
                    await userRef.update({
                        balance: firebase.firestore.FieldValue.increment(saldoAnterior)
                    });
                    showToast(`✅ ¡Migramos ${saldoAnterior} USDT de tu cuenta anterior!`);
                }
                localStorage.removeItem(LLAVE_VIEJA); // Limpiar para que no se repita
            } catch(e) { console.error("Error en migración", e); }
        }
    }

    // --- INICIO ---
    async function init() {
        if(!userId) return;
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();

        if (!doc.exists) {
            await userRef.set({
                nombre: userName,
                balance: 0,
                gameClicks: 0
            });
            await migrarDatos(userRef);
        }

        const actual = await userRef.get();
        balance = actual.data().balance || 0;
        clicks = actual.data().gameClicks || 0;
        
        document.getElementById('ref-link').innerText = `https://t.me/TuBotNombre?start=${userId}`;
        updateUI();
    }

    function updateUI() {
        document.getElementById('user-balance').innerText = balance.toFixed(6);
        document.getElementById('progress-fill').style.width = (clicks * 10) + "%";
        document.getElementById('clicks-text').innerText = `${clicks} / 10 clicks`;
        
        const btn = document.getElementById('claimBtn');
        if (clicks >= 10) {
            btn.classList.remove('disabled');
            btn.disabled = false;
        } else {
            btn.classList.add('disabled');
            btn.disabled = true;
        }
    }

    // --- ACCIONES ---
    document.getElementById('clickObject').onclick = async () => {
        if (clicks < 10) {
            clicks++;
            gsap.to('#clickObject', { scale: 0.9, duration: 0.05, yoyo: true, repeat: 1 });
            updateUI();
            await db.collection("usuarios").doc(userId).update({ gameClicks: clicks });
        }
    };

    document.getElementById('claimBtn').onclick = async () => {
        const premio = 0.0001;
        balance += premio;
        clicks = 0;
        updateUI();
        showToast(`+${premio} USDT Reclamados`);
        canvasConfetti({ particleCount: 100, spread: 70 });
        
        await db.collection("usuarios").doc(userId).update({
            balance: firebase.firestore.FieldValue.increment(premio),
            gameClicks: 0
        });
    };

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 3000);
    }

    function solicitarRetiro() {
        const id = document.getElementById('cc-id').value;
        if(id.length < 3) return showToast("ID Inválido");
        showToast("Procesando retiro...");
    }

    function copiarLink() {
        const link = document.getElementById('ref-link').innerText;
        navigator.clipboard.writeText(link);
        showToast("¡Enlace copiado!");
    }

    init();
</script>
</body>
</html>
