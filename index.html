<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT PRO</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #ffcc00;
            --premium-dark: #1a1a1a;
            --accent: #d37a5a;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdf5e6;
            color: #444;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal */
        #app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Pantallas */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0;
            background: #fdf5e6;
        }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tarjeta de Balance */
        .balance-section {
            text-align: center;
            padding: 30px 0;
        }
        #user-balance { font-size: 54px; font-weight: 800; color: var(--premium-dark); }
        .unit { font-size: 14px; letter-spacing: 3px; opacity: 0.5; }

        /* Objeto de Click Pro */
        .coin-master {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #ffe066 0%, #ffcc00 100%);
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 8px solid white;
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.3);
            transition: transform 0.1s;
        }
        .coin-master i { font-size: 90px; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Progress Bar */
        .progress-container { margin: 20px 0; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 10px; overflow: hidden; }
        .bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }
        .bar-text { text-align: center; font-size: 12px; margin-top: 8px; font-weight: 600; color: var(--accent); }

        /* Botones Elegantes */
        .btn-premium {
            background: var(--premium-dark);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-premium.disabled { background: #ccc; opacity: 0.6; }
        
        .btn-secondary { background: white; color: var(--premium-dark); }

        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .nav-item {
            background: white; padding: 15px; border-radius: 15px;
            text-align: center; font-size: 13px; font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 25px; font-size: 13px; z-index: 9999; opacity: 0; pointer-events: none;
        }

        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="app-container">
    
    <div id="home-screen" class="screen active">
        <div class="balance-section">
            <div id="user-balance">0.0000</div>
            <div class="unit">USDT DISPONIBLE</div>
        </div>

        <div class="coin-master" id="coinBtn">
            <i class="fas fa-coins"></i>
        </div>

        <div class="progress-container">
            <div class="bar-bg"><div class="bar-fill" id="pBar"></div></div>
            <div class="bar-text" id="pText">0 / 10 TOQUES</div>
        </div>

        <button class="btn-premium disabled" id="claimBtn" disabled>
            <i class="fas fa-gift"></i> RECLAMAR BONO
        </button>

        <button class="btn-premium btn-secondary" id="adBtn" style="border: 1px solid #ddd;">
            <i class="fas fa-play-circle"></i> VER ANUNCIO (+BONO)
        </button>

        <div id="timerDisplay" style="text-align: center; font-size: 12px; color: #999; margin: 10px 0;"></div>

        <div class="nav-grid">
            <div class="nav-item" onclick="nav('withdraw-screen')"><i class="fas fa-wallet"></i><br>Retiros</div>
            <div class="nav-item" onclick="nav('team-screen')"><i class="fas fa-users"></i><br>Equipo</div>
            <div class="nav-item" onclick="nav('code-screen')"><i class="fas fa-ticket-alt"></i><br>Canjes</div>
            <div class="nav-item" onclick="nav('top-screen')"><i class="fas fa-trophy"></i><br>Ranking</div>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-chevron-left"></i></div>
            <h2>Mi Billetera</h2>
        </div>
        <div style="background: white; padding: 20px; border-radius: 20px;">
            <p style="font-size: 12px; margin-bottom: 10px;">ID de CCWallet (@cctip_bot)</p>
            <input type="text" id="walletId" placeholder="Ej: 123456" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
            <button class="btn-premium" style="margin-top: 15px;" onclick="solicitarRetiro()">SOLICITAR RETIRO</button>
            <small style="display:block; text-align: center; margin-top: 10px; color: #999;">Mínimo: 0.01 USDT</small>
        </div>
    </div>

    <div id="team-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-chevron-left"></i></div>
            <h2>Mi Equipo</h2>
        </div>
        <div class="nav-item" style="margin-bottom: 15px;">
            <small>Socios Directos</small>
            <h2 id="teamCount">0</h2>
        </div>
        <button class="btn-premium" onclick="compartirLink()">INVITAR AMIGOS</button>
    </div>

    <div id="code-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-chevron-left"></i></div>
            <h2>Canje de Códigos</h2>
        </div>
        <input type="text" id="giftCode" placeholder="Ingresa el código" style="width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #ddd;">
        <button class="btn-premium" style="margin-top: 10px;" onclick="canjear()">VALIDAR CÓDIGO</button>
    </div>

    <div id="top-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="nav('home-screen')"><i class="fas fa-chevron-left"></i></div>
            <h2>Líderes</h2>
        </div>
        <div id="leaderList"></div>
    </div>

</div>

<script>
    // --- CONFIGURACIÓN FIREBASE (Mantén la tuya) ---
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    tg.expand();

    // --- VARIABLES DE ESTADO ---
    let clicks = 0;
    let bonusAds = 0;
    let isLocked = false;
    const userId = tg.initDataUnsafe?.user?.id?.toString() || "dev_user";

    // --- FUNCIONES CORE ---
    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        gsap.to(t, { opacity: 1, duration: 0.3 });
        setTimeout(() => gsap.to(t, { opacity: 0, duration: 0.3 }), 2500);
    }

    // Manejo de Clicks
    document.getElementById('coinBtn').onclick = () => {
        if(isLocked) return showToast("Espera al siguiente ciclo");
        if(clicks < 10) {
            clicks++;
            updateUI();
            gsap.fromTo("#coinBtn", {scale: 0.9}, {scale: 1, duration: 0.1});
            if(clicks === 10) {
                confetti();
                showToast("¡Listo! Ya puedes reclamar o ver Ads para subir el bono");
            }
        }
    };

    function updateUI() {
        const p = (clicks / 10) * 100;
        document.getElementById('pBar').style.width = p + "%";
        document.getElementById('pText').innerText = `${clicks} / 10 CLICKS`;
        
        const claimBtn = document.getElementById('claimBtn');
        if(clicks >= 10 && !isLocked) {
            claimBtn.disabled = false;
            claimBtn.classList.remove('disabled');
        } else {
            claimBtn.disabled = true;
            claimBtn.classList.add('disabled');
        }
    }

    // Reclamar Premio
    document.getElementById('claimBtn').onclick = async () => {
        const reward = 0.0001 + (bonusAds * 0.0001);
        await db.collection("usuarios").doc(userId).update({
            balance: firebase.firestore.FieldValue.increment(reward),
            lastClaim: Date.now()
        });
        
        confetti({ particleCount: 150, spread: 70 });
        showToast(`+${reward.toFixed(4)} USDT reclamados`);
        
        clicks = 0; bonusAds = 0;
        isLocked = true;
        updateUI();
        startTimer();
    };

    function startTimer() {
        // Lógica de 50 min de espera
        let timeLeft = 50 * 60;
        const timerInt = setInterval(() => {
            timeLeft--;
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `Próximo bono en: ${min}:${sec < 10 ? '0'+sec : sec}`;
            if(timeLeft <= 0) {
                isLocked = false;
                clearInterval(timerInt);
                document.getElementById('timerDisplay').innerText = "";
                updateUI();
            }
        }, 1000);
    }

    // Inicializar Usuario
    async function init() {
        const doc = await db.collection("usuarios").doc(userId).get();
        if(doc.exists) {
            document.getElementById('user-balance').innerText = doc.data().balance.toFixed(4);
            document.getElementById('teamCount').innerText = doc.data().referidos || 0;
        }
    }

    init();
</script>
</body>
</html>
