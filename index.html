<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT GIFT K Bot - Aesthetic Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* CSS GENERAL - COLORES AESTHETIC DE LA MAQUETA */
        body {
            font-family: 'Garamond', serif; /* Fuente elegante para balance */
            background: #fff8f0; /* Color beige muy suave de fondo */
            margin: 0;
            padding: 0;
            color: #7b5b4a; /* Marrón suave para textos */
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* CAPA DE FONDO CON LAS ONDAS AESTHETIC (Requiere imagen en GitHub) */
        .background-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('fondo.jpg'); /* Sube tu imagen de ondas aesthetic a GitHub */
            background-size: cover;
            background-position: center;
            opacity: 0.9;
            z-index: -1;
        }

        /* HEADER CON EL BOTÓN TRADUCIR Y EL SELLO DEL BONO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .translate-box {
            background-color: #f6efe4; /* Color beige claro */
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #e1d2bf;
            font-family: sans-serif;
            font-size: 14px;
            color: #7b5b4a;
        }

        .bono-badge {
            width: 70px; /* Tamaño del sello del bono */
            height: 70px;
            background-image: url('bono_badge.png'); /* Sube tu sello a GitHub */
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            cursor: pointer;
        }

        /* SECCIÓN CENTRAL DEL BALANCE DE USDT */
        .balance-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 35vh; /* Ocupa 35% de la altura */
            z-index: 5;
        }

        .balance {
            font-size: 100px; /* Balance muy grande y elegante */
            font-weight: 300; /* Letra más delgada y fina */
            margin: 0;
            padding: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05); /* Sombra sutil */
        }

        .usdt-text {
            font-size: 24px;
            font-weight: 400;
            margin-top: -10px;
        }

        /* CONTENEDOR DE BOTONES (CARD REDONDEADA) */
        .card {
            background-color: transparent;
            padding: 0 30px;
            z-index: 10;
        }

        /* ESTILO AESTHETIC DE LOS BOTONES OVALADOS */
        button {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Iconos a la izquierda */
            width: 100%;
            padding: 18px 25px;
            margin-bottom: 12px;
            border-radius: 40px; /* Muy redondeados */
            border: none;
            font-family: sans-serif; /* Botones más modernos */
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* Sombra elegante */
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(2px); /* Efecto de presionar */
        }

        /* COLORES DE LOS BOTONES DE LA MAQUETA */
        .btn-light-beige {
            background-color: #f7e6cf; /* Color beige claro de los botones 1 y 3 */
            color: #7b5b4a;
        }

        .btn-dark-brown {
            background-color: #bb7457; /* Color marrón de los botones 2 y 4 */
            color: white;
        }

        /* ICONOS (Simulación con emoji o imagen pequeña) */
        .btn-icon {
            margin-right: 15px;
            font-size: 18px;
        }

        /* STATUS DE CONEXIÓN MINIMALISTA */
        #status {
            font-family: sans-serif;
            font-size: 11px;
            color: #e1d2bf;
            margin-top: 10px;
            opacity: 0.7;
        }

    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="header">
        <div class="translate-box">A/文<br>Traducir</div>
        <div class="bono-badge" onclick="claimBonus()"></div>
    </div>

    <div class="balance-section">
        <div class="balance" id="user-balance">0.00</div>
        <div class="usdt-text">USDT</div>
    </div>

    <div class="card">
        <button class="btn-light-beige" onclick="claimBonus()">
            <span class="btn-icon">🌼</span>Recordatorio diario
        </button>

        <button class="btn-dark-brown" onclick="shareRef()">
            <span class="btn-icon">🍃</span>Invitar a un amigo
        </button>

        <button class="btn-light-beige" onclick="requestWithdraw()">
            <span class="btn-icon">☕</span>Retirar USDT
        </button>

        <button class="btn-dark-brown" onclick="canjearCodigo()">
            <span class="btn-icon">🎁</span>Canjea código de regalo
        </button>
    </div>

    <div id="status">Sincronizando ID...</div>

    <script>
        // TUS DATOS DE FIREBASE (SIN PERDER REFERIDOS)
        const firebaseConfig = {
            apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
            authDomain: "usdt-8b129.firebaseapp.com",
            projectId: "usdt-8b129",
            storageBucket: "usdt-8b129.firebasestorage.app",
            messagingSenderId: "816855613636",
            appId: "1:816855613636:web:7891ba3996acef2c91c991"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.backgroundColor = '#fff8f0'; // Setea color de fondo de la app en Telegram
        tg.headerColor = '#fff8f0';
        
        const user = tg.initDataUnsafe?.user;
        const startParam = tg.initDataUnsafe?.start_param;

        // CARGAR DATOS SIN QUE SE PIERDAN
        async function loadData() {
            if (!user) {
                document.getElementById('status').innerText = "Abre desde Telegram";
                return;
            }

            const userRef = db.collection("usuarios").doc(user.id.toString());
            let doc = await userRef.get();

            if (!doc.exists) {
                // Nuevo usuario (con referido si existe - sigue a 0.50 USDT)
                if (startParam && startParam !== user.id.toString()) {
                    const inviterRef = db.collection("usuarios").doc(startParam);
                    await inviterRef.update({
                        balance: firebase.firestore.FieldValue.increment(0.50),
                        referidos: firebase.firestore.FieldValue.increment(1)
                    });
                }

                await userRef.set({
                    nombre: user.first_name,
                    balance: 0.00,
                    referidos: 0,
                    id: user.id
                });
                doc = await userRef.get();
            }

            const data = doc.data();
            document.getElementById('user-balance').innerText = data.balance.toFixed(2);
            document.getElementById('status').innerText = "USDT GIFT K | ID: " + user.id;
        }

        // FUNCIÓN BONO (BOTÓN 1 Y SELLO SUPERIOR)
        async function claimBonus() {
            const userRef = db.collection("usuarios").doc(user.id.toString());
            await userRef.update({ balance: firebase.firestore.FieldValue.increment(0.05) });
            tg.showAlert("¡Has recibido 0.05 USDT de regalo!");
            loadData();
        }

        // FUNCIÓN INVITAR (BOTÓN 2)
        function shareRef() {
            const refLink = `https://t.me/USDTGIFTKBot?startapp=${user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=Gana USDT gratis con USDT GIFT K`);
        }

        // FUNCIÓN RETIRO (BOTÓN 3)
        function requestWithdraw() {
            tg.showAlert("Mínimo de retiro: 10 USDT. Tu saldo se actualizará pronto.");
        }

        // FUNCIÓN CÓDIGO REGALO (BOTÓN 4 - Sin programar, solo ejemplo)
        function canjearCodigo() {
            tg.showConfirm("¿Tienes un código de regalo?", (confirmed) => {
                if (confirmed) {
                    tg.showAlert("Canjeando código... (Función en desarrollo)");
                }
            });
        }

        loadData();
    </script>
</body>
</html>
