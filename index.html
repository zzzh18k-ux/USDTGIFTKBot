<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT K</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #ffcc00;
            --orange-gradient: linear-gradient(135deg, #d37a5a 0%, #e68d71 100%);
            --bg-color: #fdf5e6;
            --text-main: #5d4037;
            --accent: #d37a5a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdf5e6;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .screen { display: none; flex-direction: column; width: 100%; height: 100%; }
        .screen.active { display: flex; }

        .balance-card { text-align: center; margin: 10px 0; }
        #user-balance { font-size: 44px; font-weight: 800; }
        
        /* OBJETO DE CLICS */
        .click-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .click-object {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #ffdd99, #d4a86a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(211, 122, 90, 0.3);
            border: 6px solid white;
            transition: transform 0.1s;
        }
        .click-object:active { transform: scale(0.92); }
        .click-object i { font-size: 80px; color: white; }

        .status-container {
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 25px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 12px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        #energy-fill {
            height: 100%;
            width: 0%;
            background: var(--orange-gradient);
            transition: width 0.3s;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            display: none;
        }
        #claim-btn { background: #2ecc71; color: white; }
        #double-btn { background: #3498db; color: white; }
        
        .timer-msg { 
            text-align: center; 
            font-weight: 600; 
            color: #e74c3c; 
            margin-top: 10px; 
            display: none;
        }

        .menu-bottom {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .menu-btn {
            background: white;
            border: none;
            padding: 10px;
            border-radius: 15px;
            font-size: 18px;
            color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 80px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            opacity: 0;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="home-screen" class="screen active">
        <div class="balance-card">
            <div id="user-balance">0.0000</div>
            <p style="font-size: 12px; opacity: 0.6; letter-spacing: 2px;">USDT BALANCE</p>
        </div>

        <div class="click-area">
            <div class="click-object" id="main-clicker">
                <i class="fas fa-hand-pointer"></i>
            </div>
            
            <div class="status-container">
                <div style="display: flex; justify-content: space-between; font-size: 13px;">
                    <span>Energía de Clics</span>
                    <span id="click-count">0/10</span>
                </div>
                <div class="progress-bar">
                    <div id="energy-fill"></div>
                </div>
                
                <p id="reward-info" style="text-align: center; font-weight: 600; margin-top: 5px;"></p>
                
                <button id="claim-btn" class="btn-action">RECLAMAR 0.0001$</button>
                <button id="double-btn" class="btn-action">DOBLAR (Anuncios: 0/5)</button>
                <div id="timer-msg" class="timer-msg">Bloqueado por 50 min</div>
            </div>
        </div>

        <div class="menu-bottom">
            <button class="menu-btn" onclick="navigate('invite-screen')"><i class="fas fa-users"></i></button>
            <button class="menu-btn" onclick="navigate('withdraw-screen')"><i class="fas fa-wallet"></i></button>
            <button class="menu-btn" onclick="navigate('redeem-screen')"><i class="fas fa-ticket-alt"></i></button>
            <button class="menu-btn" onclick="navigate('leaderboard-screen')"><i class="fas fa-trophy"></i></button>
        </div>
    </div>
    
    <div id="invite-screen" class="screen">...</div>
    <div id="withdraw-screen" class="screen">...</div>
    <div id="redeem-screen" class="screen">...</div>
    <div id="leaderboard-screen" class="screen">...</div>
</div>

<div id="toast" class="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    const userId = tg.initDataUnsafe?.user?.id?.toString() || "test_user";

    let clicks = 0;
    let adsWatched = 0;
    let isBlocked = false;
    let baseReward = 0.0001;

    async function init() {
        const doc = await db.collection("usuarios").doc(userId).get();
        if (doc.exists) {
            const data = doc.data();
            document.getElementById('user-balance').innerText = (data.balance || 0).toFixed(6);
            checkLock(data.lastClaim);
        }
        updateUI();
    }

    function checkLock(lastClaim) {
        if (!lastClaim) return;
        const now = Date.now();
        const diff = (now - lastClaim) / (1000 * 60);
        if (diff < 50) {
            isBlocked = true;
            startTimer(50 - diff);
        }
    }

    function updateUI() {
        document.getElementById('click-count').innerText = `${clicks}/10`;
        document.getElementById('energy-fill').style.width = `${clicks * 10}%`;
        
        const claimBtn = document.getElementById('claim-btn');
        const doubleBtn = document.getElementById('double-btn');
        const clicker = document.getElementById('main-clicker');

        if (isBlocked) {
            clicker.style.opacity = "0.3";
            claimBtn.style.display = "none";
            doubleBtn.style.display = "none";
        } else if (clicks >= 10) {
            claimBtn.style.display = "block";
            doubleBtn.style.display = "block";
            doubleBtn.innerText = `DOBLAR A ${(baseReward * 2).toFixed(5)}$ (Ads: ${adsWatched}/5)`;
        } else {
            claimBtn.style.display = "none";
            doubleBtn.style.display = "none";
        }
    }

    document.getElementById('main-clicker').onclick = () => {
        if (isBlocked || clicks >= 10) return;
        clicks++;
        tg.HapticFeedback.impactOccurred('light');
        updateUI();
    };

    document.getElementById('double-btn').onclick = () => {
        if (adsWatched < 5) {
            showToast("Viendo anuncio...");
            setTimeout(() => {
                adsWatched++;
                baseReward *= 2;
                showToast(`¡Ganancia doblada a ${baseReward.toFixed(5)}!`);
                updateUI();
            }, 2000);
        } else {
            showToast("Límite de anuncios alcanzado.");
        }
    };

    document.getElementById('claim-btn').onclick = async () => {
        const finalReward = baseReward;
        await db.collection("usuarios").doc(userId).update({
            balance: firebase.firestore.FieldValue.increment(finalReward),
            lastClaim: Date.now()
        });
        
        canvasConfetti();
        showToast(`+${finalReward.toFixed(5)} USDT`);
        isBlocked = true;
        clicks = 0;
        adsWatched = 0;
        baseReward = 0.0001;
        startTimer(50);
        init();
    };

    function startTimer(minutes) {
        const timerMsg = document.getElementById('timer-msg');
        timerMsg.style.display = "block";
        let seconds = Math.floor(minutes * 60);
        
        const interval = setInterval(() => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            timerMsg.innerText = `Próximos clics en ${m}:${s < 10 ? '0' : ''}${s}`;
            seconds--;
            if (seconds < 0) {
                clearInterval(interval);
                isBlocked = false;
                timerMsg.style.display = "none";
                document.getElementById('main-clicker').style.opacity = "1";
                updateUI();
            }
        }, 1000);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.opacity = "1";
        setTimeout(() => t.style.opacity = "0", 2000);
    }

    init();
</script>
</body>
</html>
