<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT GIFT K - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #fdf5e6;
            --primary-accent: #d2a679;
            --secondary-accent: #e6b8a2;
            --text-main: #5d4037;
            --btn-orange: #d37a5a;
            --btn-cream: #f3d5b5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top left, #f3d5b5 0%, transparent 20%),
                              radial-gradient(circle at bottom right, #e6b8a2 0%, transparent 20%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pantallas */
        .screen {
            position: absolute;
            top: 20px;
            width: calc(100% - 40px);
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estética de la Imagen */
        .header-deco {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .lang-badge {
            background: white;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 14px;
        }

        .bonus-badge {
            background: #fff;
            border: 2px dashed var(--primary-accent);
            padding: 10px;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            font-size: 8px;
            text-align: center;
            justify-content: center;
            cursor: pointer;
        }

        .balance-section {
            text-align: center;
            margin: 60px 0;
        }

        .balance-amount {
            font-size: 64px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1;
        }

        .balance-label {
            font-size: 20px;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        /* Botones Estilo Píldora */
        .menu-buttons { width: 100%; display: flex; flex-direction: column; gap: 15px; }

        .btn-custom {
            border: none;
            padding: 18px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .btn-custom:active { transform: scale(0.98); }

        .btn-cream { background-color: var(--btn-cream); color: var(--text-main); }
        .btn-orange { background-color: var(--btn-orange); color: white; }

        /* Decoración de hojas */
        .leaf-icon { position: absolute; opacity: 0.2; z-index: -1; }

        /* Pantallas de Detalle */
        .detail-card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .back-btn {
            margin-top: 20px;
            background: none;
            border: 1px solid var(--primary-accent);
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--primary-accent);
            cursor: pointer;
        }

        .input-elegant {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ddd;
            margin: 15px 0;
            outline: none;
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <div id="home-screen" class="screen active">
        <div class="header-deco">
            <div class="lang-badge">A / 文 <br><small>Traducir</small></div>
            <div class="bonus-badge" onclick="claimBonus()">
                <i class="fas fa-gift" style="font-size: 20px;"></i>
                Bono Diario
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-amount" id="user-balance">0.00</div>
            <div class="balance-label">USDT</div>
        </div>

        <div class="menu-buttons">
            <button class="btn-custom btn-cream" onclick="claimBonus()">
                <i class="fas fa-certificate"></i> Recordatorio diario
            </button>
            <button class="btn-custom btn-orange" onclick="showScreen('invite-screen')">
                <i class="fas fa-seedling"></i> Invitar a un amigo
            </button>
            <button class="btn-custom btn-cream" onclick="showScreen('withdraw-screen')">
                <i class="fas fa-coffee"></i> Retirar USDT
            </button>
            <button class="btn-custom btn-orange" onclick="showScreen('gift-screen')">
                <i class="fas fa-box-open"></i> Canjea código de regalo
            </button>
        </div>
        
        <div id="status" style="margin-top: 30px; font-size: 10px; opacity: 0.5;">Cargando...</div>
    </div>

    <div id="invite-screen" class="screen">
        <div class="detail-card">
            <i class="fas fa-users" style="font-size: 40px; color: var(--btn-orange);"></i>
            <h2 style="margin: 15px 0;">Mis Invitados</h2>
            <div style="font-size: 30px; font-weight: bold;" id="ref-count">0</div>
            <p style="font-size: 14px; opacity: 0.7;">Gana 0.50 USDT por cada referido.</p>
            <button class="btn-custom btn-orange" style="margin-top: 20px; width: 100%;" onclick="shareRef()">
                Copiar Link de Invitación
            </button>
            <button class="back-btn" onclick="showScreen('home-screen')">Volver</button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="detail-card">
            <i class="fas fa-wallet" style="font-size: 40px; color: var(--primary-accent);"></i>
            <h2 style="margin: 15px 0;">Retirar Fondos</h2>
            <p>Mínimo de retiro: 10.00 USDT</p>
            <input type="text" class="input-elegant" placeholder="Dirección de billetera USDT (BEP20)">
            <button class="btn-custom btn-cream" style="width: 100%;" onclick="requestWithdraw()">Solicitar Pago</button>
            <button class="back-btn" onclick="showScreen('home-screen')">Volver</button>
        </div>
    </div>

    <div id="gift-screen" class="screen">
        <div class="detail-card">
            <i class="fas fa-tags" style="font-size: 40px; color: var(--btn-orange);"></i>
            <h2 style="margin: 15px 0;">Código de Regalo</h2>
            <input type="text" class="input-elegant" placeholder="Ingresa tu código aquí">
            <button class="btn-custom btn-orange" style="width: 100%;" onclick="tg.showAlert('Código no válido')">Canjear</button>
            <button class="back-btn" onclick="showScreen('home-screen')">Volver</button>
        </div>
    </div>

</div>

<script>
    // --- CONFIGURACIÓN FIREBASE (Mantenemos la suya original) ---
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    const startParam = tg.initDataUnsafe?.start_param;

    // Lógica de Navegación entre pantallas
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // CARGAR DATOS
    async function loadData() {
        if (!user) {
            document.getElementById('status').innerText = "Abre desde Telegram";
            // Para pruebas en PC descomenta la linea de abajo:
            // return; 
        }

        const userRef = db.collection("usuarios").doc(user.id.toString());
        let doc = await userRef.get();

        if (!doc.exists) {
            if (startParam && startParam !== user.id.toString()) {
                const inviterRef = db.collection("usuarios").doc(startParam);
                await inviterRef.update({
                    balance: firebase.firestore.FieldValue.increment(0.50),
                    referidos: firebase.firestore.FieldValue.increment(1)
                }).catch(() => console.log("Inviter no existe"));
            }

            await userRef.set({
                nombre: user.first_name,
                balance: 0.00,
                referidos: 0,
                id: user.id
            });
            doc = await userRef.get();
        }

        const data = doc.data();
        document.getElementById('user-balance').innerText = data.balance.toFixed(2);
        document.getElementById('ref-count').innerText = data.referidos;
        document.getElementById('status').innerText = "Conectado como " + user.first_name;
    }

    // FUNCIÓN BONO
    async function claimBonus() {
        const userRef = db.collection("usuarios").doc(user.id.toString());
        await userRef.update({ balance: firebase.firestore.FieldValue.increment(0.05) });
        tg.showAlert("¡Has recibido 0.05 USDT!");
        loadData();
    }

    // FUNCIÓN RETIRO
    async function requestWithdraw() {
        const userRef = db.collection("usuarios").doc(user.id.toString());
        const doc = await userRef.get();
        const balance = doc.data().balance;

        if (balance >= 10) {
            tg.showConfirm("¿Confirmas el retiro de tus fondos?", (confirmed) => {
                if(confirmed) tg.showAlert("Solicitud enviada a revisión.");
            });
        } else {
            tg.showAlert("Necesitas al menos 10.00 USDT.");
        }
    }

    // INVITAR
    function shareRef() {
        const refLink = `https://t.me/USDTGIFTKBot?startapp=${user.id}`;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=🎁 Regístrate y gana USDT gratis`);
    }

    loadData();
</script>
</body>
</html>
