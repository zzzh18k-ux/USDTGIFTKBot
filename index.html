<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT K</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #ffcc00;
            --orange-gradient: linear-gradient(135deg, #d37a5a 0%, #e68d71 100%);
            --bg-color: #fdf5e6;
            --text-main: #5d4037;
            --accent: #d37a5a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdf5e6;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #gradient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #fdf5e6, #fff5ea, #ffedd8, #fdf5e6);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        #app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 1;
            height: 100vh;
            overflow-y: auto;
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            position: absolute;
            left: 20px; right: 20px;
            top: 20px; bottom: 20px;
            padding: 20px;
            overflow-y: auto;
        }
        .screen.active { display: flex; }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .streak-badge {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 8px;
            color: var(--accent);
        }

        .balance-card {
            text-align: center;
            margin: 40px 0;
            perspective: 1000px;
        }
        #user-balance {
            font-size: 70px;
            font-weight: 800;
            display: inline-block;
            transition: transform 0.1s ease;
        }
        .balance-label {
            font-size: 14px;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-top: -10px;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--orange-gradient);
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .menu-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }

        .btn-game {
            background: white;
            border: none;
            padding: 22px;
            border-radius: 24px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-game::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            pointer-events: none;
        }
        .btn-game:active::after { left: 100%; }

        .btn-primary {
            background: var(--orange-gradient);
            color: white;
        }

        .floating-bonus {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .glass-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 30px;
            border: 1px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-top: 40px;
            text-align: center;
        }

        .back-circle {
            width: 50px; height: 50px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* Toast personalizado */
        .toast-premium {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
        }
        .countdown-text {
            font-size: 12px;
            color: var(--accent);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="gradient-bg"></div>
<div id="toast-element" class="toast-premium"></div>

<div id="app-container">

    <div id="home-screen" class="screen active">
        <div class="top-nav">
            <div class="streak-badge">
                <i class="fas fa-fire"></i>
                <span id="streak-count">0</span> DIAS
            </div>
            <div class="streak-badge">
                <i class="fas fa-users"></i>
                <span id="active-users">...</span>
            </div>
        </div>

        <div class="balance-card">
            <div id="user-balance">0.00</div>
            <div class="balance-label">USDT</div>
            
            <div style="margin-top: 20px;">
                <small id="motivational-text" style="font-weight: 600; color: var(--accent);"></small>
            </div>

            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
            <small style="opacity: 0.5;">RETIRO MINIMO 10.00</small>
            <div id="bonus-countdown" class="countdown-text"></div>
        </div>

        <div class="menu-grid">
            <button class="btn-game btn-primary floating-bonus" id="bonusBtn">
                <span><i class="fas fa-gift"></i> Bono Diario</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            <button class="btn-game" id="inviteNavBtn">
                <span><i class="fas fa-heart"></i> Crecer Equipo</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-game" id="withdrawNavBtn">
                <span><i class="fas fa-coins"></i> Mi Cosecha</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-game" id="leaderboardNavBtn">
                <span><i class="fas fa-trophy"></i> Top Usuarios</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <div id="invite-screen" class="screen">
        <div class="back-circle" id="backHomeInvite"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <i class="fas fa-rocket" style="font-size: 50px; color: var(--accent);"></i>
            <h2 style="margin: 20px 0;">Sistema de Socios</h2>
            <p>Gana <b>0.50 USDT</b> por cada invitado y el <b>15%</b> de sus ganancias</p>
            
            <div style="background: white; padding: 20px; border-radius: 20px; margin: 20px 0;">
                <small>Comision acumulada</small>
                <h3 id="comm-pending">0.00 USDT</h3>
                <button class="btn-game btn-primary" style="margin-top: 10px; padding: 12px; width: 100%;" id="claimCommBtn">Reclamar</button>
            </div>

            <div style="background: white; padding: 20px; border-radius: 20px; margin: 20px 0;">
                <small>Amigos invitados</small>
                <h3 id="referidos-count">0</h3>
                <button class="btn-game" style="margin-top: 10px; padding: 12px; width: 100%;" id="viewInvitesBtn">Lista de invitados</button>
            </div>

            <button class="btn-game" style="width: 100%;" id="shareRefBtn">
                <i class="fas fa-share-alt"></i> Compartir Link
            </button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="back-circle" id="backHomeWithdraw"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <i class="fas fa-wallet" style="font-size: 50px; color: #2ecc71;"></i>
            <h2 style="margin: 15px 0;">Retirar</h2>
            <input type="text" id="wallet-address" class="btn-game" style="width: 100%; border: 2px solid #eee; margin-bottom: 15px;" placeholder="0x...">
            <button class="btn-game btn-primary" style="width: 100%;" id="withdrawSubmitBtn">Solicitar Pago</button>
            <p style="margin-top: 15px; font-size: 12px; opacity: 0.6;">Minimo 10.00 USDT</p>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <div class="back-circle" id="backHomeLeader"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">Top 10 Global</h2>
            <div id="leaderboard-list" style="text-align: left;"></div>
        </div>
    </div>

    <div id="invites-list-screen" class="screen">
        <div class="back-circle" id="backToInvite"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">Mis invitados</h2>
            <div id="invites-list" style="text-align: left;"></div>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#fdf5e6');
    tg.setBackgroundColor('#fdf5e6');

    const userId = tg.initDataUnsafe?.user?.id?.toString();
    const userName = tg.initDataUnsafe?.user?.first_name || "Usuario";

    let currentUserData = null;

    function showToast(message) {
        const toast = document.getElementById('toast-element');
        toast.textContent = message;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            }
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
    };

    function navigate(screenId) {
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'leaderboard-screen') loadLeaderboard();
        if(screenId === 'invites-list-screen') loadInvitesList();
    }

    async function initUser() {
        if(!userId) return;
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const startParam = tg.initDataUnsafe?.start_param;

        if (!doc.exists) {
            let inviterId = (startParam && startParam !== userId) ? startParam : "none";
            if(inviterId !== "none") {
                const invRef = db.collection("usuarios").doc(inviterId);
                const invDoc = await invRef.get();
                if(invDoc.exists) {
                    await invRef.update({ 
                        balance: firebase.firestore.FieldValue.increment(0.50),
                        referidos: firebase.firestore.FieldValue.increment(1)
                    });
                }
            }
            await userRef.set({
                nombre: userName,
                balance: 0.00,
                comision: 0.00,
                invitado_por: inviterId,
                referidos: 0,
                streak: 0,
                lastBonus: 0,
                wallet: "",
                id: userId
            });
        }
        await updateUI();
        updateActiveUsersCount();
        setInterval(() => updateBonusTimer(), 60000);
    }

    async function updateUI() {
        if(!userId) return;
        const doc = await db.collection("usuarios").doc(userId).get();
        currentUserData = doc.data();
        if(!currentUserData) return;

        const balanceEl = document.getElementById('user-balance');
        const oldVal = parseFloat(balanceEl.innerText);
        if(oldVal < currentUserData.balance) {
            gsap.to(balanceEl, { scale: 1.2, duration: 0.1, yoyo: true, repeat: 1 });
        }
        balanceEl.innerText = currentUserData.balance.toFixed(2);
        document.getElementById('comm-pending').innerText = (currentUserData.comision || 0).toFixed(4) + " USDT";
        document.getElementById('streak-count').innerText = currentUserData.streak || 0;
        document.getElementById('referidos-count').innerText = currentUserData.referidos || 0;

        const progress = Math.min((currentUserData.balance / 10) * 100, 100);
        document.getElementById('progress-fill').style.width = progress + "%";

        if(currentUserData.balance >= 9.5 && currentUserData.balance < 10) {
            document.getElementById('motivational-text').innerText = "Umbral de retiro próximo";
        } else {
            const msgs = ["Ascenso constante", "Objetivo próximo", "Racha activa", "Acumulando valor"];
            document.getElementById('motivational-text').innerText = msgs[Math.floor(Math.random() * msgs.length)];
        }

        if(currentUserData.wallet) {
            document.getElementById('wallet-address').value = currentUserData.wallet;
        }
        updateBonusTimer();
    }

    function updateBonusTimer() {
        if(!currentUserData) return;
        const lastBonus = currentUserData.lastBonus || 0;
        const now = Date.now();
        const diff = (now - lastBonus) / (1000 * 60 * 60);
        if(diff < 24) {
            const remaining = (24 - diff);
            const hours = Math.floor(remaining);
            const minutes = Math.floor((remaining - hours) * 60);
            document.getElementById('bonus-countdown').innerText = `Disponible en ${hours}h ${minutes}m`;
        } else {
            document.getElementById('bonus-countdown').innerText = "";
        }
    }

    async function updateActiveUsersCount() {
        const snapshot = await db.collection("usuarios").get();
        document.getElementById('active-users').innerText = snapshot.size;
    }

    async function claimDailyBonus() {
        if(!userId) return;
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const data = doc.data();
        const now = Date.now();
        const lastBonus = data.lastBonus || 0;
        const diff = (now - lastBonus) / (1000 * 60 * 60);

        if (diff < 24) {
            const remaining = (24 - diff);
            const hours = Math.floor(remaining);
            const minutes = Math.floor((remaining - hours) * 60);
            showToast(`Disponible en ${hours}h ${minutes}m`);
            return;
        }

        let newStreak = (diff < 48) ? (data.streak || 0) + 1 : 1;
        let bonoFinal = 0.05;
        let isSpecial = (newStreak % 7 === 0);
        if (isSpecial) bonoFinal += 0.50;

        await userRef.update({
            balance: firebase.firestore.FieldValue.increment(bonoFinal),
            lastBonus: now,
            streak: newStreak
        });

        if (data.invitado_por && data.invitado_por !== "none") {
            await db.collection("usuarios").doc(data.invitado_por).update({
                comision: firebase.firestore.FieldValue.increment(bonoFinal * 0.15)
            });
        }

        playSound('coin');
        canvasConfetti({ particleCount: isSpecial ? 200 : 100, spread: 70, origin: { y: 0.6 } });
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        showToast(`+${bonoFinal.toFixed(2)} USDT`);
        await updateUI();
    }

    async function claimCommissions() {
        if(!userId) return;
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const c = doc.data().comision || 0;
        if(c <= 0) { showToast("Sin comisiones"); return; }
        await userRef.update({
            balance: firebase.firestore.FieldValue.increment(c),
            comision: 0
        });
        playSound('coin');
        canvasConfetti({ particleCount: 80, spread: 50, origin: { y: 0.5 } });
        showToast(`+${c.toFixed(4)} USDT`);
        await updateUI();
    }

    async function loadLeaderboard() {
        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = "Cargando...";
        const snapshot = await db.collection("usuarios").orderBy("balance", "desc").limit(10).get();
        listEl.innerHTML = "";
        let i = 1;
        snapshot.forEach(doc => {
            const u = doc.data();
            listEl.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee;"><span>${i}. ${u.nombre.substring(0, 12)}</span><span style="font-weight:800; color:var(--accent);">${u.balance.toFixed(2)} USDT</span></div>`;
            i++;
        });
    }

    async function loadInvitesList() {
        if(!userId) return;
        const listEl = document.getElementById('invites-list');
        listEl.innerHTML = "Cargando...";
        const snapshot = await db.collection("usuarios").where("invitado_por", "==", userId).get();
        listEl.innerHTML = "";
        if(snapshot.empty) { listEl.innerHTML = "<p style='text-align:center; opacity:0.6;'>Sin invitados</p>"; return; }
        snapshot.forEach(doc => {
            const u = doc.data();
            listEl.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee;"><span><i class='fas fa-user'></i> ${u.nombre}</span><span style="color:var(--accent);">${u.balance.toFixed(2)} USDT</span></div>`;
        });
    }

    function copyRefLink() {
        if(!userId) return;
        const link = `https://t.me/USDTGIFTKBot?startapp=${userId}`;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=USDT GIFT K — acumula saldo`);
        playSound('success');
        showToast("Link generado");
    }

    async function handleWithdraw() {
        if(!userId) return;
        const addr = document.getElementById('wallet-address').value.trim();
        if(!addr.startsWith('0x') || addr.length !== 42) { showToast("Direccion invalida"); return; }
        const doc = await db.collection("usuarios").doc(userId).get();
        if(doc.data().balance < 10) { showToast("Minimo 10.00 USDT"); return; }
        await db.collection("usuarios").doc(userId).update({ wallet: addr });
        playSound('success');
        showToast("Solicitud enviada");
    }

    document.getElementById('bonusBtn').onclick = claimDailyBonus;
    document.getElementById('inviteNavBtn').onclick = () => navigate('invite-screen');
    document.getElementById('withdrawNavBtn').onclick = () => navigate('withdraw-screen');
    document.getElementById('leaderboardNavBtn').onclick = () => navigate('leaderboard-screen');
    document.getElementById('backHomeInvite').onclick = () => navigate('home-screen');
    document.getElementById('backHomeWithdraw').onclick = () => navigate('home-screen');
    document.getElementById('backHomeLeader').onclick = () => navigate('home-screen');
    document.getElementById('backToInvite').onclick = () => navigate('invite-screen');
    document.getElementById('claimCommBtn').onclick = claimCommissions;
    document.getElementById('shareRefBtn').onclick = copyRefLink;
    document.getElementById('viewInvitesBtn').onclick = () => navigate('invites-list-screen');
    document.getElementById('withdrawSubmitBtn').onclick = handleWithdraw;

    initUser();
</script>
</body>
</html>
