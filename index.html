<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT GIFT K Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .balance { font-size: 35px; font-weight: bold; color: #00ff88; margin: 10px 0; }
        button { background: #00d2ff; border: none; color: white; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button.invite { background: #8e44ad; }
        button.withdraw { background: #e67e22; }
        button.task { background: #2ecc71; margin-bottom: 5px; }
        .info-text { font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>USDT GIFT K BOT</h1>
    
    <div class="card">
        <div>Balance Actual</div>
        <div class="balance" id="user-balance">0.00 USDT</div>
        <button onclick="claimBonus()">🎁 Bono Diario (0.05)</button>
        <button class="withdraw" onclick="requestWithdraw()">💸 Retirar (Mínimo 10.00)</button>
    </div>

    <div class="card">
        <h3>Tareas Extra</h3>
        <button class="task" onclick="doTask('https://t.me/TuCanal', 0.10)">📢 Unirse al Canal (+0.10)</button>
        <div class="info-text">Más tareas pronto...</div>
    </div>

    <div class="card">
        <div>Invitados: <span id="ref-count">0</span></div>
        <button class="invite" onclick="shareRef()">🔗 Invitar Amigos (0.50)</button>
    </div>

    <div id="status" style="font-size: 12px; color: #888;">Cargando datos...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
            authDomain: "usdt-8b129.firebaseapp.com",
            projectId: "usdt-8b129",
            storageBucket: "usdt-8b129.firebasestorage.app",
            messagingSenderId: "816855613636",
            appId: "1:816855613636:web:7891ba3996acef2c91c991"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        const startParam = tg.initDataUnsafe?.start_param;

        // CARGAR DATOS SIN QUE SE PIERDAN
        async function loadData() {
            if (!user) {
                document.getElementById('status').innerText = "Abre desde Telegram";
                return;
            }

            const userRef = db.collection("usuarios").doc(user.id.toString());
            let doc = await userRef.get();

            if (!doc.exists) {
                // Nuevo usuario (con referido si existe)
                if (startParam && startParam !== user.id.toString()) {
                    const inviterRef = db.collection("usuarios").doc(startParam);
                    await inviterRef.update({
                        balance: firebase.firestore.FieldValue.increment(0.50),
                        referidos: firebase.firestore.FieldValue.increment(1)
                    }).catch(() => console.log("Inviter no existe"));
                }

                await userRef.set({
                    nombre: user.first_name,
                    balance: 0.00,
                    referidos: 0,
                    id: user.id
                });
                doc = await userRef.get();
            }

            const data = doc.data();
            document.getElementById('user-balance').innerText = data.balance.toFixed(2) + " USDT";
            document.getElementById('ref-count').innerText = data.referidos;
            document.getElementById('status').innerText = "ID: " + user.id + " | Conectado ✅";
        }

        // FUNCIÓN BONO
        async function claimBonus() {
            const userRef = db.collection("usuarios").doc(user.id.toString());
            await userRef.update({ balance: firebase.firestore.FieldValue.increment(0.05) });
            tg.showAlert("¡Has recibido 0.05 USDT!");
            loadData();
        }

        // FUNCIÓN RETIRO
        async function requestWithdraw() {
            const userRef = db.collection("usuarios").doc(user.id.toString());
            const doc = await userRef.get();
            const balance = doc.data().balance;

            if (balance >= 10) {
                tg.showAlert("Solicitud enviada. Escribe a soporte con tu ID: " + user.id);
            } else {
                tg.showAlert("Necesitas al menos 10.00 USDT para retirar.");
            }
        }

        // TAREAS
        function doTask(url, reward) {
            tg.openTelegramLink(url);
            tg.showConfirm("¿Te uniste al canal?", async (confirmed) => {
                if (confirmed) {
                    const userRef = db.collection("usuarios").doc(user.id.toString());
                    await userRef.update({ balance: firebase.firestore.FieldValue.increment(reward) });
                    loadData();
                }
            });
        }

        // INVITAR
        function shareRef() {
            const refLink = `https://t.me/USDTGIFTKBot?startapp=${user.id}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=🎁 Regístrate y gana USDT gratis`);
        }

        loadData();
    </script>
</body>
</html>
