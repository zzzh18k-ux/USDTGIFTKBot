<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT GIFT K Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1c1c1c; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: #2b2b2b; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #00d2ff; font-size: 24px; }
        .balance { font-size: 35px; font-weight: bold; margin: 10px 0; color: #4cd137; }
        button { background: #00d2ff; border: none; color: white; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        button.invite { background: #9b59b6; }
        button.withdraw { background: #e67e22; }
        .info { font-size: 14px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>USDT GIFT K BOT</h1>

    <div class="card">
        <div>Mi Balance</div>
        <div class="balance" id="user-balance">0.00 USDT</div>
        <button onclick="claimDaily()">Reclamar Bono Diario</button>
    </div>

    <div class="card">
        <div>Invitados: <span id="ref-count">0</span></div>
        <button class="invite" onclick="shareRef()">Invitar Amigos</button>
    </div>

    <div class="card">
        <button class="withdraw" onclick="openWithdraw()">Retirar Fondos</button>
    </div>

    <div id="status" class="info">Cargando datos...</div>

    <script>
        // Inicializamos la App de Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expandir la app a pantalla completa

        // Datos básicos del usuario de Telegram
        const user = tg.initDataUnsafe?.user;
        const startParam = tg.initDataUnsafe?.start_param; // Aquí está el ID del que invita

        // Elementos de la pantalla
        const balanceEl = document.getElementById('user-balance');
        const refCountEl = document.getElementById('ref-count');
        const statusEl = document.getElementById('status');

        function initApp() {
            if (user) {
                statusEl.innerText = `Hola ${user.first_name}!`;
                
                // PRUEBA DE REFERIDO: Si alguien entró con link, avisamos
                if (startParam) {
                    statusEl.innerText += `\nFelicidades! Te invitó el ID: ${startParam}`;
                }
            } else {
                statusEl.innerText = "Error: Ábrelo desde Telegram.";
            }
        }

        function shareRef() {
            const userId = user ? user.id : '000';
            const botUsername = 'TU_BOT_AQUI'; // <--- Cambia esto por el nombre de tu bot
            const refLink = `https://t.me/${botUsername}?startapp=${userId}`;
            
            // Copiar al portapapeles o usar el compartir de Telegram
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=Únete y gana USDT gratis!`);
        }

        function openWithdraw() {
            tg.showAlert("Mínimo de retiro: 5.00 USDT. ¡Sigue invitando!");
        }

        function claimDaily() {
            tg.showAlert("Bono de 0.05 USDT reclamado con éxito.");
        }

        // Arrancar la app
        initApp();
    </script>
</body>
</html>
