<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT GIFT K - Royal Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --bg-color: #fdf5e6;
            --primary-accent: #d2a679;
            --text-main: #5d4037;
            --btn-orange: #d37a5a;
            --btn-cream: #f3d5b5;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(211, 122, 90, 0.1) 0%, transparent 20%);
            color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex; justify-content: center;
        }

        #app-container { width: 100%; max-width: 450px; position: relative; padding: 20px; z-index: 1; overflow-y: auto; }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.5s; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cabecera */
        .balance-section { text-align: center; margin: 30px 0; animation: pulse 3s infinite; }
        .balance-amount { font-size: 60px; font-weight: 600; color: var(--text-main); }
        .balance-label { font-size: 18px; letter-spacing: 3px; opacity: 0.7; }

        /* Tarjetas Estilo Imagen */
        .detail-card {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 35px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid white;
            margin-bottom: 20px;
        }

        /* Botones */
        .btn-custom {
            border: none; padding: 18px; border-radius: 50px; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s; width: 100%; margin-bottom: 12px;
        }
        .btn-cream { background: var(--btn-cream); color: var(--text-main); }
        .btn-orange { background: var(--btn-orange); color: white; }
        .btn-custom:active { transform: scale(0.96); }

        /* Historiales */
        .history-list { width: 100%; max-height: 200px; overflow-y: auto; margin-top: 15px; text-align: left; }
        .history-item { 
            padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); 
            display: flex; justify-content: space-between; font-size: 13px;
        }

        .back-btn { background: none; border: 1px solid var(--primary-accent); padding: 10px 25px; border-radius: 20px; color: var(--primary-accent); margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-container">
    
    <div id="home-screen" class="screen active">
        <div class="balance-section">
            <div class="balance-amount" id="user-balance">0.00</div>
            <div class="balance-label">USDT TOTAL</div>
        </div>

        <div style="width: 100%;">
            <button class="btn-custom btn-cream" onclick="claimBonus()">
                <span><i class="fas fa-gift"></i> Bono Diario</span>
                <i class="fas fa-plus-circle"></i>
            </button>
            <button class="btn-custom btn-orange" onclick="showScreen('invite-screen')">
                <span><i class="fas fa-users"></i> Invitar y Ganar 15%</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-custom btn-cream" onclick="showScreen('withdraw-screen')">
                <span><i class="fas fa-wallet"></i> Retiros e Historial</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <div id="invite-screen" class="screen">
        <div class="detail-card">
            <i class="fas fa-chart-line" style="font-size: 40px; color: var(--btn-orange);"></i>
            <h2 style="margin: 10px 0;">Sistema de Socios</h2>
            <p style="font-size: 13px; margin-bottom: 15px;">Ganas el <b>15% de por vida</b> de todo lo que generen tus invitados.</p>
            
            <div style="background: #fff; padding: 15px; border-radius: 20px; margin-bottom: 15px;">
                <small>Comisión por Reclamar:</small>
                <div style="font-size: 24px; font-weight: bold;" id="comm-pending">0.00 USDT</div>
                <button class="btn-custom btn-orange" style="margin-top: 10px; padding: 10px;" onclick="claimCommission()">
                    Reclamar Comisión
                </button>
            </div>

            <button class="btn-custom btn-cream" onclick="shareRef()">Copiar Link</button>
            
            <div class="history-list">
                <center><small><b>HISTORIAL DE REFERIDOS</b></small></center>
                <div id="ref-history"></div>
            </div>

            <button class="back-btn" onclick="showScreen('home-screen')">Volver</button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="detail-card">
            <i class="fas fa-university" style="font-size: 40px; color: var(--primary-accent);"></i>
            <h2 style="margin: 10px 0;">Mis Retiros</h2>
            <p style="font-size: 13px;">Mínimo 10.00 USDT</p>
            
            <input type="text" class="input-elegant" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin:10px 0;" placeholder="Billetera USDT BEP20">
            <button class="btn-custom btn-orange" onclick="requestWithdraw()">Retirar Ahora</button>

            <div class="history-list">
                <center><small><b>HISTORIAL DE PAGOS</b></small></center>
                <div id="withdraw-history"></div>
            </div>

            <button class="back-btn" onclick="showScreen('home-screen')">Volver</button>
        </div>
    </div>

</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    const startParam = tg.initDataUnsafe?.start_param;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'invite-screen') loadRefHistory();
        if(id === 'withdraw-screen') loadWithdrawHistory();
    }

    async function loadData() {
        if (!user) return;
        const userRef = db.collection("usuarios").doc(user.id.toString());
        let doc = await userRef.get();

        if (!doc.exists) {
            let inviter = (startParam && startParam !== user.id.toString()) ? startParam : "none";
            await userRef.set({
                nombre: user.first_name,
                balance: 0.00,
                comision: 0.00,
                referidos_count: 0,
                invitado_por: inviter,
                id: user.id
            });
            doc = await userRef.get();
        }

        const data = doc.data();
        document.getElementById('user-balance').innerText = data.balance.toFixed(2);
        document.getElementById('comm-pending').innerText = (data.comision || 0).toFixed(2) + " USDT";
    }

    // Lógica 15%: Al reclamar bono, el invitado le da el 15% al que lo invitó
    async function claimBonus() {
        const userRef = db.collection("usuarios").doc(user.id.toString());
        const userDoc = await userRef.get();
        const data = userDoc.data();
        const bono = 0.05;

        // Sumar al usuario
        await userRef.update({ balance: firebase.firestore.FieldValue.increment(bono) });

        // Dar 15% al patrocinador
        if (data.invitado_por && data.invitado_por !== "none") {
            const comision = bono * 0.15;
            await db.collection("usuarios").doc(data.invitado_por).update({
                comision: firebase.firestore.FieldValue.increment(comision)
            });
        }

        tg.showAlert("¡Bono recibido! Tus referidos están generando comisiones para ti.");
        loadData();
    }

    async function claimCommission() {
        const userRef = db.collection("usuarios").doc(user.id.toString());
        const doc = await userRef.get();
        const comm = doc.data().comision || 0;

        if(comm > 0) {
            await userRef.update({
                balance: firebase.firestore.FieldValue.increment(comm),
                comision: 0
            });
            tg.showAlert("Comisiones transferidas al balance principal.");
            loadData();
        } else {
            tg.showAlert("No tienes comisiones pendientes.");
        }
    }

    // HISTORIALES SIMULADOS (Para que se vea profesional)
    function loadRefHistory() {
        const div = document.getElementById('ref-history');
        div.innerHTML = `<div class="history-item"><span>User_ID_${Math.floor(Math.random()*1000)}</span><span style="color:green">+0.01</span></div>
                         <div class="history-item"><span>User_ID_${Math.floor(Math.random()*1000)}</span><span style="color:green">+0.01</span></div>`;
    }

    function loadWithdrawHistory() {
        const div = document.getElementById('withdraw-history');
        div.innerHTML = `<div class="history-item"><span>2024-03-01</span><span style="color:orange">Pendiente</span></div>`;
    }

    function shareRef() {
        const refLink = `https://t.me/USDTGIFTKBot?startapp=${user.id}`;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=🎁 Gana USDT y 15% de comisiones conmigo.`);
    }

    loadData();
</script>
</body>
</html>
