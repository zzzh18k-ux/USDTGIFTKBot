<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT K - Ultra Premium</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #ffcc00;
            --orange-gradient: linear-gradient(135deg, #d37a5a 0%, #e68d71 100%);
            --bg-color: #fdf5e6;
            --text-main: #5d4037;
            --accent: #d37a5a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #fdf5e6;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Fondo Animado */
        #gradient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #fdf5e6, #fff5ea, #ffedd8, #fdf5e6);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        #app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* Pantallas */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0; top: 0;
            padding: 20px;
            overflow-y: auto;
        }
        .screen.active { display: flex; }

        /* Header UI */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .streak-badge {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 8px;
            color: var(--accent);
        }

        /* Balance con efecto Pop */
        .balance-card {
            text-align: center;
            margin: 40px 0;
            perspective: 1000px;
        }
        #user-balance {
            font-size: 70px;
            font-weight: 800;
            display: inline-block;
            transition: transform 0.1s ease;
        }
        .balance-label {
            font-size: 14px;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-top: -10px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--orange-gradient);
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Botones Gamificados */
        .menu-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }

        .btn-game {
            background: white;
            border: none;
            padding: 22px;
            border-radius: 24px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Efecto Shimmer */
        .btn-game::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            pointer-events: none;
        }
        .btn-game:active::after { left: 100%; }

        .btn-primary {
            background: var(--orange-gradient);
            color: white;
        }

        .floating-bonus {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Detail Cards */
        .glass-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 30px;
            border: 1px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-top: 40px;
            text-align: center;
        }

        .back-circle {
            width: 50px; height: 50px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="gradient-bg"></div>

<div id="app-container">

    <div id="home-screen" class="screen active">
        <div class="top-nav">
            <div class="streak-badge">
                <i class="fas fa-fire animate__animated animate__pulse animate__infinite"></i>
                <span id="streak-count">0</span> DÍAS
            </div>
            <div class="streak-badge" style="color: #2ecc71;">
                <i class="fas fa-users"></i>
                <span id="active-users">...</span>
            </div>
        </div>

        <div class="balance-card">
            <div id="user-balance">0.00</div>
            <div class="balance-label">USDT DISPONIBLE</div>
            
            <div style="margin-top: 20px;">
                <small id="motivational-text" style="font-weight: 600; color: var(--accent);"></small>
            </div>

            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
            <small style="opacity: 0.5;">META DE RETIRO: 10.00 USDT</small>
        </div>

        <div class="menu-grid">
            <button class="btn-game btn-primary floating-bonus" onclick="claimDailyBonus()">
                <span><i class="fas fa-gift"></i> Bono Diario</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            <button class="btn-game" onclick="navigate('invite-screen')">
                <span><i class="fas fa-heart"></i> Crecer Equipo</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-game" onclick="navigate('withdraw-screen')">
                <span><i class="fas fa-coins"></i> Mi Cosecha</span>
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-game" onclick="navigate('leaderboard-screen')">
                <span><i class="fas fa-trophy"></i> Top Usuarios</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <div id="invite-screen" class="screen">
        <div class="back-circle" onclick="navigate('home-screen')"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <i class="fas fa-rocket" style="font-size: 50px; color: var(--accent);"></i>
            <h2 style="margin: 20px 0;">Sistema de Socios</h2>
            <p>Gana <b>0.50 USDT</b> por cada invitado y el <b>15%</b> de sus ganancias de por vida.</p>
            
            <div style="background: white; padding: 20px; border-radius: 20px; margin: 20px 0;">
                <small>Comisión acumulada:</small>
                <h3 id="comm-pending">0.00 USDT</h3>
                <button class="btn-game btn-primary" style="margin-top: 10px; padding: 12px; width: 100%;" onclick="claimCommissions()">Reclamar ahora</button>
            </div>

            <button class="btn-game" style="width: 100%;" onclick="copyRefLink()">
                <i class="fas fa-share-alt"></i> Compartir Link
            </button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="back-circle" onclick="navigate('home-screen')"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <i class="fas fa-wallet" style="font-size: 50px; color: #2ecc71;"></i>
            <h2 style="margin: 15px 0;">Retirar Cosecha</h2>
            <input type="text" id="wallet-address" class="btn-game" style="width: 100%; border: 2px solid #eee; margin-bottom: 15px;" placeholder="Dirección BEP20">
            <button class="btn-game btn-primary" style="width: 100%;" onclick="handleWithdraw()">Iniciar Pago</button>
            <p style="margin-top: 15px; font-size: 12px; opacity: 0.6;">Mínimo: 10 USDT. Procesado en 24h.</p>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <div class="back-circle" onclick="navigate('home-screen')"><i class="fas fa-arrow-left"></i></div>
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">Top 10 Global</h2>
            <div id="leaderboard-list" style="text-align: left;">
                </div>
        </div>
    </div>

</div>

<script>
    // --- CONFIGURACIÓN FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram.WebApp;
    tg.expand();

    // --- SONIDOS (Sintetizados para evitar carga externa lenta) ---
    const playSound = (type) => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            }
            
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) { console.log("Audio no soportado"); }
    };

    // --- LÓGICA DE NAVEGACIÓN CON ANIMACIÓN ---
    function navigate(screenId) {
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        
        const current = document.querySelector('.screen.active');
        const next = document.getElementById(screenId);
        
        gsap.to(current, { opacity: 0, x: -20, duration: 0.3, onComplete: () => {
            current.classList.remove('active');
            next.classList.add('active');
            gsap.fromTo(next, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 });
        }});

        if(screenId === 'leaderboard-screen') loadLeaderboard();
    }

    // --- LÓGICA DE DATOS ---
    const userId = tg.initDataUnsafe?.user?.id?.toString() || "test_user";
    const userName = tg.initDataUnsafe?.user?.first_name || "Buscador";

    async function initUser() {
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const startParam = tg.initDataUnsafe?.start_param;

        if (!doc.exists) {
            let inviterId = (startParam && startParam !== userId) ? startParam : "none";
            
            // Pagar bono al invitador
            if(inviterId !== "none") {
                const invRef = db.collection("usuarios").doc(inviterId);
                await invRef.update({ 
                    balance: firebase.firestore.FieldValue.increment(0.50),
                    referidos: firebase.firestore.FieldValue.increment(1)
                }).catch(() => {});
            }

            await userRef.set({
                nombre: userName,
                balance: 0.00,
                comision: 0.00,
                invitado_por: inviterId,
                referidos: 0,
                streak: 0,
                lastBonus: 0,
                id: userId
            });
        }
        updateUI();
        simulateActiveUsers();
    }

    function simulateActiveUsers() {
        document.getElementById('active-users').innerText = Math.floor(Math.random() * (450 - 300) + 300);
    }

    async function updateUI() {
        const doc = await db.collection("usuarios").doc(userId).get();
        const data = doc.data();

        // Efecto Pop en el balance
        const balanceEl = document.getElementById('user-balance');
        const oldVal = parseFloat(balanceEl.innerText);
        if(oldVal < data.balance) {
            gsap.to(balanceEl, { scale: 1.2, duration: 0.1, yoyo: true, repeat: 1 });
        }

        balanceEl.innerText = data.balance.toFixed(2);
        document.getElementById('comm-pending').innerText = (data.comision || 0).toFixed(4) + " USDT";
        document.getElementById('streak-count').innerText = data.streak || 0;

        // Progress bar
        const progress = Math.min((data.balance / 10) * 100, 100);
        document.getElementById('progress-fill').style.width = progress + "%";

        // Mensajes motivadores
        const msgs = ["🔥 Vas como un tiburón", "💎 Imparable", "⚡ Rumbo a la cima", "💰 Cosechando éxito"];
        document.getElementById('motivational-text').innerText = msgs[Math.floor(Math.random() * msgs.length)];
    }

    async function claimDailyBonus() {
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const data = doc.data();
        
        const now = Date.now();
        const lastBonus = data.lastBonus || 0;
        const diff = (now - lastBonus) / (1000 * 60 * 60);

        if (diff < 24) {
            const horasRestantes = (24 - diff).toFixed(1);
            tg.showAlert(`⌛ Paciencia, tiburón. Vuelve en ${horasRestantes} horas.`);
            return;
        }

        let newStreak = (diff < 48) ? (data.streak || 0) + 1 : 1;
        let bonoFinal = 0.05;
        let isSpecial = false;

        if (newStreak % 7 === 0) {
            bonoFinal += 0.50;
            isSpecial = true;
        }

        await userRef.update({
            balance: firebase.firestore.FieldValue.increment(bonoFinal),
            lastBonus: now,
            streak: newStreak
        });

        // 15% para el patrocinador
        if (data.invitado_por && data.invitado_por !== "none") {
            await db.collection("usuarios").doc(data.invitado_por).update({
                comision: firebase.firestore.FieldValue.increment(bonoFinal * 0.15)
            });
        }

        // Animaciones
        playSound('coin');
        confetti({ particleCount: isSpecial ? 200 : 100, spread: 70, origin: { y: 0.6 } });
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
        tg.showAlert(isSpecial ? `🏆 ¡RACHA SEMANAL! Ganaste 0.55 USDT` : `✨ ¡Bono de ${bonoFinal} USDT recibido!`);
        updateUI();
    }

    async function loadLeaderboard() {
        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = "Cargando...";
        
        const snapshot = await db.collection("usuarios").orderBy("balance", "desc").limit(10).get();
        listEl.innerHTML = "";
        
        let i = 1;
        snapshot.forEach(doc => {
            const u = doc.data();
            listEl.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee;">
                    <span>${i}. ${u.nombre.substring(0, 12)}</span>
                    <span style="font-weight:800; color:var(--accent);">${u.balance.toFixed(2)} USDT</span>
                </div>
            `;
            i++;
        });
    }

    function copyRefLink() {
        const link = `https://t.me/USDTGIFTKBot?startapp=${userId}`;
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=🎁 ¡Únete a mi equipo de inversores y gana USDT diario!`);
        playSound('success');
    }

    async function handleWithdraw() {
        const addr = document.getElementById('wallet-address').value;
        if(addr.length < 10) { tg.showAlert("Dirección no válida"); return; }
        
        const doc = await db.collection("usuarios").doc(userId).get();
        if(doc.data().balance < 10) {
            tg.showAlert("⚠️ Necesitas 10.00 USDT para retirar.");
        } else {
            playSound('success');
            tg.showConfirm("¿Confirmas el retiro a esta billetera?", (res) => {
                if(res) tg.showAlert("🚀 Solicitud enviada. Recibirás tu pago en 24 horas.");
            });
        }
    }

    async function claimCommissions() {
        const userRef = db.collection("usuarios").doc(userId);
        const doc = await userRef.get();
        const c = doc.data().comision || 0;
        
        if(c <= 0) { tg.showAlert("No tienes comisiones aún."); return; }
        
        await userRef.update({
            balance: firebase.firestore.FieldValue.increment(c),
            comision: 0
        });
        
        playSound('coin');
        tg.showAlert(`💎 ${c.toFixed(4)} USDT transferidos a tu balance.`);
        updateUI();
    }

    // Inicializar
    initUser();
</script>
</body>
</html>
