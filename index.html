<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USDT GIFT K - Moneda Dorada</title>
    
    <!-- Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='10853207' data-sdk='show_10853207'></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ESTILOS MÍNIMOS PARA QUE FUNCIONE */
        :root { --gold: #D4AF37; --cream: #FFFDF7; --terracotta: #D68B7C; --text-dark: #3A2C27; --text-soft: #6B4E44; --success: #6BAF92; --danger: #E86A6A; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--cream); height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--cream); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; }
        #loading-screen.hidden { display: none; }
        .welcome-title { font-size: 36px; font-weight: 800; color: var(--gold); margin-bottom: 16px; }
        #app-container { width: 100%; max-width: 450px; height: 100vh; padding: 6px 14px; display: flex; flex-direction: column; overflow: hidden; }
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
        .balance-card { text-align: center; margin: 10px 0; padding: 15px; background: rgba(255,255,255,0.7); border-radius: 40px; }
        #user-balance { font-size: 40px; font-weight: 800; color: var(--gold); }
        .video-card { background: rgba(255,255,255,0.7); border-radius: 40px; padding: 10px 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .video-btn { padding: 10px 20px; border-radius: 40px; border: none; font-weight: 700; background: linear-gradient(135deg, var(--gold), var(--terracotta)); color: white; cursor: pointer; }
        .video-btn:disabled { opacity: 0.5; }
        .bonus-card { border: 2px solid var(--gold); margin: 15px 0; }
        .menu-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .btn-game { padding: 15px; border-radius: 40px; border: none; background: rgba(255,255,255,0.8); cursor: pointer; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="welcome-title">USDT GIFT K</div>
    <div style="margin-top: 20px; color: var(--text-soft);">Cargando...</div>
</div>

<div id="app-container">
    <div id="home-screen" class="screen active">
        <div class="balance-card">
            <div id="user-balance">0</div>
            <div>⭐ MONEDAS</div>
        </div>
        
        <div class="section-title">📺 Videos</div>
        <div class="video-card">
            <span>#1 VIDEO (+10⭐)</span>
            <button class="video-btn" id="video1Btn">Ver</button>
        </div>
        <div class="video-card">
            <span>#2 VIDEO (+5⭐)</span>
            <button class="video-btn" id="video2Btn">Ver</button>
        </div>
        
        <div class="section-title" style="margin-top: 20px;">🎁 BONO DIARIO (4x5⭐)</div>
        <div class="video-card bonus-card">
            <span id="agBonusTitle">BONO DISPONIBLE</span>
            <button class="video-btn" id="agBonusBtn" style="background: #FFD700;">Ver Anuncio</button>
        </div>
        
        <div class="menu-grid">
            <button class="btn-game" id="gameNavBtn">🎮 Doble o Nada</button>
            <button class="btn-game" id="inviteNavBtn">💖 Invitar y Ganar</button>
            <button class="btn-game" id="withdrawNavBtn">💰 Retirar</button>
        </div>
    </div>
</div>

<adsgram-task id="adsgramTask" data-block-id="task-28364" data-debug="true" style="display: none;"></adsgram-task>

<script>
    // ==================== FORZAR OCULTAR PANTALLA DE CARGA ====================
    setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
    }, 3000); // 3 segundos máximo
    
    // ==================== CONFIGURACION FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyALWJpB7Ut2s-JUcC7hhXODRrFHhuBoHZU",
        authDomain: "usdt-8b129.firebaseapp.com",
        projectId: "usdt-8b129",
        storageBucket: "usdt-8b129.firebasestorage.app",
        messagingSenderId: "816855613636",
        appId: "1:816855613636:web:7891ba3996acef2c91c991"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    let userId = tg.initDataUnsafe?.user?.id?.toString() || 'test_' + Date.now();
    let userData = { balance: 0, adGramCount: 0 };
    
    // ==================== FUNCIONES BÁSICAS ====================
    function updateUI() {
        document.getElementById('user-balance').innerText = userData.balance || 0;
        const count = userData.adGramCount || 0;
        const btn = document.getElementById('agBonusBtn');
        const title = document.getElementById('agBonusTitle');
        
        if (count >= 4) {
            btn.disabled = true;
            btn.innerHTML = '🔒';
            title.innerText = '¡BONO COMPLETO!';
        } else {
            btn.innerHTML = `Ver Anuncio #${count + 1}`;
            title.innerText = `ANUNCIO #${count + 1} DISPONIBLE`;
        }
    }
    
    async function initUser() {
        const ref = db.collection("usuarios").doc(userId);
        const doc = await ref.get();
        
        if (!doc.exists) {
            await ref.set({ balance: 0, adGramCount: 0, adGramUnlockTime: null });
            userData = { balance: 0, adGramCount: 0 };
        } else {
            userData = doc.data();
        }
        
        updateUI();
        document.getElementById('loading-screen').classList.add('hidden');
    }
    
    // ==================== EVENT LISTENERS ====================
    document.getElementById('video1Btn').onclick = () => {
        userData.balance += 10;
        updateUI();
        alert('🎉 +10 ⭐');
    };
    
    document.getElementById('video2Btn').onclick = () => {
        userData.balance += 5;
        updateUI();
        alert('🎉 +5 ⭐');
    };
    
    document.getElementById('agBonusBtn').onclick = async () => {
        const count = userData.adGramCount || 0;
        if (count >= 4) return;
        
        const taskElement = document.getElementById('adsgramTask');
        taskElement.style.display = 'block';
        
        taskElement.addEventListener('reward', () => {
            userData.adGramCount = count + 1;
            userData.balance += 5;
            updateUI();
            taskElement.style.display = 'none';
            alert(`🎉 ¡ANUNCIO #${count + 1} COMPLETADO! +5⭐`);
            db.collection("usuarios").doc(userId).update({ 
                balance: userData.balance, 
                adGramCount: userData.adGramCount 
            });
        }, { once: true });
        
        taskElement.addEventListener('onError', () => {
            taskElement.style.display = 'none';
            alert('No se pudo mostrar el anuncio.');
        }, { once: true });
    };
    
    document.getElementById('gameNavBtn').onclick = () => alert('Juego en desarrollo');
    document.getElementById('inviteNavBtn').onclick = () => alert('Invitar amigos');
    document.getElementById('withdrawNavBtn').onclick = () => alert('Retirar');
    
    // Iniciar
    initUser();
</script>
</body>
</html>
