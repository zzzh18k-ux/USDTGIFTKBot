    <script>
        // ==================== CONFIGURACIÓN (SIN TOCAR NADA EXISTENTE) ====================
        const firebaseConfig = { /* ... */ };
        // ... todas tus constantes y variables existentes ...

        // ==================== NUEVA CONFIGURACIÓN PARA ADSGRAM ====================
        const ADSGRAM_REWARDS = [5, 5, 5, 5];
        const TOTAL_ADSGRAM = 4;
        const ADSGRAM_BLOCK_ID = 'task-28364'; // Tu Block ID de AdsGram
        let agTimers = [];

        // ==================== FUNCIONES EXISTENTES SIN MODIFICAR ====================
        // initUser, updateUI, watchVideo, etc. NO SE TOCAN.

        // ==================== NUEVAS FUNCIONES PARA ADSGRAM ====================
        function isAdGramLocked(adNum) {
            const unlockTime = userData?.adGramUnlockTimes?.[adNum];
            return unlockTime ? Date.now() < unlockTime : false;
        }

        function getAdGramUnlockTimeString(adNum) {
            const unlockTime = userData?.adGramUnlockTimes?.[adNum];
            if (!unlockTime) return '';
            const remaining = unlockTime - Date.now();
            if (remaining <= 0) return '';
            const h = Math.floor(remaining / (60 * 60 * 1000));
            const m = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            return `🔒 ${h}h ${m}m`;
        }

        function updateAdsGramUI() {
            if (!userData) return;
            const adUnlocks = userData.adGramUnlockTimes || {};
            let watched = 0;
            for (let i = 1; i <= TOTAL_ADSGRAM; i++) {
                if (adUnlocks[i] && Date.now() < adUnlocks[i]) watched++;
            }
            document.getElementById('adsGramWatchedCount').innerText = watched;
            const dots = document.querySelectorAll('#adsGramDots .dot');
            dots.forEach((dot, idx) => {
                const adNum = idx + 1;
                dot.classList.toggle('completed', !!(adUnlocks[adNum] && Date.now() < adUnlocks[adNum]));
            });

            for (let i = 1; i <= TOTAL_ADSGRAM; i++) {
                const btn = document.getElementById(`agAd${i}Btn`);
                const card = document.getElementById(`agAd${i}Card`);
                const unlockSpan = document.getElementById(`agAd${i}Unlock`);
                if (btn) {
                    const locked = isAdGramLocked(i);
                    btn.disabled = locked || isProcessing;
                    if (locked) {
                        btn.innerHTML = '🔒';
                        card?.classList.add('completed');
                    } else {
                        btn.innerHTML = (i === 2 || i === 4) ? 'Ver' : 'Ver';
                        card?.classList.remove('completed');
                    }
                }
                if (unlockSpan) unlockSpan.textContent = getAdGramUnlockTimeString(i);
            }
        }

        function startAdsGramTimers() {
            agTimers.forEach(t => clearInterval(t));
            agTimers = [];
            for (let i = 1; i <= TOTAL_ADSGRAM; i++) {
                const timer = setInterval(() => {
                    const unlockSpan = document.getElementById(`agAd${i}Unlock`);
                    const btn = document.getElementById(`agAd${i}Btn`);
                    if (unlockSpan && btn) {
                        unlockSpan.textContent = getAdGramUnlockTimeString(i);
                        const locked = isAdGramLocked(i);
                        btn.disabled = locked || isProcessing;
                        if (locked) btn.innerHTML = '🔒';
                        else if (!(userData?.adGramUnlockTimes?.[i] && Date.now() < userData.adGramUnlockTimes[i])) {
                            btn.innerHTML = (i === 2 || i === 4) ? 'Ver' : 'Ver';
                        }
                    }
                }, 1000);
                agTimers.push(timer);
            }
        }

        async function watchAdGram(n) {
            if (isProcessing || isAdPlaying) { showToast('⏳ Espera...'); return; }
            if (isAdGramLocked(n)) {
                showAlert('Anuncio bloqueado', `Disponible en ${getAdGramUnlockTimeString(n)}`, 'clock');
                return;
            }
            if (!userData) return;

            isProcessing = true;
            isAdPlaying = true;
            updateUI();
            updateAdsGramUI();
            showAdLoader();

            try {
                // Inicializar AdsGram y mostrar anuncio
                const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
                await AdController.show(); // Espera a que el usuario complete el anuncio

                // Recompensa
                const reward = ADSGRAM_REWARDS[n - 1];
                const unlockTime = Date.now() + (UNLOCK_HOURS * 60 * 60 * 1000);
                const newUnlocks = { ...(userData.adGramUnlockTimes || {}) };
                newUnlocks[n] = unlockTime;
                userData.adGramUnlockTimes = newUnlocks;
                userData.balance += reward;

                saveToLocal({ ...userData, userId });
                await updateUI();
                updateAdsGramUI();
                updateGameUI();

                // Mensajes motivacionales grandes
                let message = `+${reward} ⭐`;
                if (n === 1) message = "🎉 ¡PRIMER ANUNCIO! +5⭐. ¡SIGUE ASÍ!";
                else if (n === 2) message = "🔥 ¡SEGUNDO ANUNCIO! +5⭐. ¡VAS POR LA MITAD!";
                else if (n === 3) message = "⚡ ¡TERCER ANUNCIO! +5⭐. ¡SOLO UNO MÁS!";
                else if (n === 4) message = "🏆 ¡BONO COMPLETO! +5⭐. ¡MÁXIMO ALCANZADO!";

                showAlert('🎁 ¡Recompensa!', message, 'check-circle');

                // Sincronizar con Firebase
                syncToFirebase({
                    balance: firebase.firestore.FieldValue.increment(reward),
                    adGramUnlockTimes: newUnlocks
                });

            } catch (error) {
                console.error('Error en anuncio AdsGram:', error);
                showAlert('Aviso', 'No se pudo completar el anuncio. Intenta de nuevo.', 'exclamation-triangle');
            } finally {
                hideAdLoader();
                isProcessing = false;
                isAdPlaying = false;
                updateUI();
                updateAdsGramUI();
            }
        }

        // ==================== MODIFICACIÓN MÍNIMA EN initUser ====================
        // Añadir adGramUnlockTimes al usuario si no existe, y cargar timers.
        // (Busca la función initUser() existente y añade estas líneas dentro)
        async function initUser() {
            // ... (todo el código existente de initUser) ...
            
            // Después de cargar userData, agregar:
            if (!userData.adGramUnlockTimes) userData.adGramUnlockTimes = {};
            
            // Al final de initUser, después de startUnlockTimers():
            startAdsGramTimers();
            
            // Y en updateUI() existente, añadir una llamada a updateAdsGramUI() al final
            // (Lo añadiré en el código completo para que no se te pase)
        }

        // ==================== MODIFICACIÓN MÍNIMA EN updateUI ====================
        // Añadir updateAdsGramUI() al final de updateUI existente
        async function updateUI() {
            // ... (todo el código existente de updateUI) ...
            updateAdsGramUI(); // <-- AÑADIR ESTA LÍNEA AL FINAL
        }

        // ==================== EVENT LISTENERS PARA LOS NUEVOS BOTONES ====================
        document.getElementById('agAd1Btn').onclick = () => watchAdGram(1);
        document.getElementById('agAd2Btn').onclick = () => watchAdGram(2);
        document.getElementById('agAd3Btn').onclick = () => watchAdGram(3);
        document.getElementById('agAd4Btn').onclick = () => watchAdGram(4);
    </script>
